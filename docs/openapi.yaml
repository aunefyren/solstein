openapi: 3.1.0
info:
  title: Solstein API
  version: "1"
  summary: Podcast RSS proxy with optional regional exits and ad removal.
  description: |
    Solstein's HTTP interface: the feed and episode URLs podcast clients use,
    the prefix subscribe route, the feed management API and the health check.
    How the features behind it work is described in `docs/` (start at
    `docs/README.md`).

    **Access.** Every route except `/api/health` is refused with `403` for
    clients outside `allowed_client_networks` (when set). On top of that:
    - The prefix route and the feed API need the subscribe token
      (`auth_token` in `config.json`).
    - Feed and episode URLs need the `sig` query parameter that Solstein
      wrote into them: an HMAC over the exact path. Clients get these URLs
      from the rendered feed or from the API's `feed_url`; they are never
      built by hand.
    - With `disable_auth: true`, neither the token nor signatures are
      checked.

    **Errors** are JSON objects with a single `error` message. Internal
    details go to Solstein's log, never into responses.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: "{externalURL}"
    variables:
      externalURL:
        default: http://localhost:8080
        description: Solstein's `external_url`.

tags:
  - name: Clients
    description: Routes podcast clients use.
  - name: Feed API
    description: Managing feeds; needs the subscribe token.
  - name: Operations
    description: Health checks.
  - name: Web UI
    description: |
      HTML pages for people (`docs/web-ui.md`), only when `web_ui.enabled`
      is on. Every page but the sign-in steps and static files needs a
      session (`docs/sign-in.md`): without one, the answer is `303` to
      `/ui/login?next=<page>`. A form posted from another site is refused
      with `403`, as is anything from outside `allowed_client_networks`.

paths:
  /api/health:
    get:
      tags: [Operations]
      summary: Health check
      description: |
        Reports that the process is up. It says nothing about module state
        (a VPN tunnel being down doesn't make it fail), so a container isn't
        restarted over it. Exempt from `allowed_client_networks`.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Solstein is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    examples: ["v1.0.0"]

  /api/rss/{token}/{sourceURL}:
    get:
      tags: [Clients]
      summary: Subscribe by prefix URL
      description: |
        Puts Solstein in front of an existing feed: subscribe to this URL in
        the podcast client. The first request subscribes to the source feed
        (fetching it with a 20-second limit); later requests serve Solstein's
        rewritten copy, which it polls on its own schedule.

        `{sourceURL}` is the rest of the path, slashes included, followed by
        the source's own query string, e.g.
        `/api/rss/{token}/https://feeds.acast.com/public/shows/abc`.
        `https:/host/…` (a slash collapsed by a reverse proxy) and a URL
        without a scheme (`https://` is assumed) are accepted too.

        With `disable_auth`, the `{token}` segment may be left out:
        `/api/rss/https://feeds.acast.com/…`.
      operationId: subscribeByPrefix
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The subscribe token (`auth_token`).
          schema:
            type: string
        - name: sourceURL
          in: path
          required: true
          description: The source feed's URL, slashes included, not encoded.
          schema:
            type: string
          examples:
            acast:
              value: https://feeds.acast.com/public/shows/abc
      responses:
        "200":
          $ref: "#/components/responses/Feed"
        "400":
          description: The source URL isn't a valid http(s) URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong token, source host not in `allowed_source_hosts`, or client outside `allowed_client_networks`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The source couldn't be fetched, or isn't a valid RSS feed. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/feeds/{feedID}.xml:
    get:
      tags: [Clients]
      summary: Get a feed by its signed URL
      description: |
        The rewritten feed, as the feed API's `feed_url` and the feed's own
        self-links point to. Rendered on each request from the last good
        source document and the episodes' current state.
      operationId: getFeed
      security: []
      parameters:
        - $ref: "#/components/parameters/FeedID"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          $ref: "#/components/responses/Feed"
        "403":
          $ref: "#/components/responses/BadSignature"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/episodes/{feedID}/{episodeID}.{extension}:
    parameters:
      - $ref: "#/components/parameters/FeedID"
      - name: episodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: extension
        in: path
        required: true
        description: The audio's file extension, as in the feed's enclosure URL.
        schema:
          type: string
          pattern: "^[a-z0-9]{1,5}$"
          examples: ["mp3"]
      - $ref: "#/components/parameters/Signature"
    get:
      tags: [Clients]
      summary: Get an episode's audio
      description: |
        The enclosure URL. How the audio is delivered depends on the feed:
        - **Cached:** served from disk, with `Range`, `If-Range` and
          conditional requests.
        - **Processed feed (region diff) without its processed file yet:**
          processed while the client waits, up to 20 seconds, then served
          from the cache. If it takes longer, `503` with `Retry-After`; the
          processing carries on and the next request gets the file.
        - **`original` mode:** `302` to the source.
        - **Otherwise:** streamed from the source through the feed's exit,
          with `Range` forwarded.
      operationId: getEpisode
      security: []
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          examples:
            firstBytes:
              value: bytes=0-1023
      responses:
        "200":
          $ref: "#/components/responses/Audio"
        "206":
          $ref: "#/components/responses/PartialAudio"
        "302":
          description: "`original` delivery mode: the audio is at the source."
          headers:
            Location:
              schema:
                type: string
                format: uri
        "403":
          $ref: "#/components/responses/BadSignature"
        "404":
          description: No such episode, or it is withheld (its processing failed and the feed's failure policy is `hide`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The source couldn't be fetched, or didn't send audio. Nothing has been sent yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/StillProcessing"
    head:
      tags: [Clients]
      summary: Get an episode's headers
      description: As `GET`, without the body.
      operationId: headEpisode
      security: []
      responses:
        "200":
          description: The headers a `GET` would get.
        "302":
          description: "`original` delivery mode."
        "403":
          description: Missing or wrong signature.
        "404":
          description: No such episode, or it is withheld.
        "503":
          description: The episode is still being processed.

  /api/v1/feeds:
    get:
      tags: [Feed API]
      summary: List feeds
      operationId: listFeeds
      responses:
        "200":
          description: Every subscribed feed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Feed API]
      summary: Subscribe to a feed
      description: |
        Subscribes to a source feed and returns it, with the signed
        `feed_url` to give a podcast client. The source is fetched at once
        (20-second limit) and nothing is stored unless it is a valid RSS
        feed. Posting a source that is already subscribed returns the
        existing feed, unchanged, with `200`.
      operationId: createFeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [source_url]
                  properties:
                    source_url:
                      type: string
                      format: uri
                      examples: ["https://feeds.acast.com/public/shows/abc"]
                - $ref: "#/components/schemas/FeedSettings"
            examples:
              plain:
                value:
                  source_url: https://feeds.acast.com/public/shows/abc
              withRegionDiff:
                value:
                  source_url: https://feeds.acast.com/public/shows/abc
                  exit: norway
                  region_diff: "on"
                  region_diff_exits: [norway, sweden]
      responses:
        "200":
          description: Already subscribed; the existing feed, settings unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "201":
          description: Subscribed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Invalid body, source URL or settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The source host isn't in `allowed_source_hosts`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The source couldn't be fetched, or isn't a valid RSS feed. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/feeds/{feedID}:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    get:
      tags: [Feed API]
      summary: Get a feed
      operationId: getFeedSettings
      responses:
        "200":
          description: The feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Feed API]
      summary: Change a feed's settings
      description: |
        Changes the settings given; omitted fields are left alone, and an
        empty value (`""`, `[]`, `0`) clears the override so the global
        setting applies. Cached episodes made with settings that no longer
        apply (another exit, delivery mode, region-diff settings) are cleared
        at once and prepared again on their next play; failed episodes whose
        settings changed are retried.
      operationId: updateFeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedSettings"
            examples:
              regionDiffOn:
                value:
                  region_diff: "on"
              backToGlobal:
                value:
                  exit: ""
                  region_diff: ""
      responses:
        "200":
          description: The feed with its new settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Invalid body or settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Feed API]
      summary: Remove a feed
      description: Removes the feed, its episodes and its cached audio.
      operationId: deleteFeed
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/feeds/{feedID}/retry:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    post:
      tags: [Feed API]
      summary: Retry a feed's failed episodes
      description: |
        Queues every failed episode of the feed for another attempt in the
        background: withheld episodes (region diff's `on_failure: hide`)
        and episodes published unprocessed. New episodes are prepared
        first; the rest follow two at a time. An episode that succeeds is
        published (or its processed file replaces the unprocessed one); a
        withheld episode that fails again starts its slow retries afresh
        (after 1 hour, 6 hours, then daily for about a week).
      operationId: retryFailedEpisodes
      responses:
        "200":
          $ref: "#/components/responses/Queued"
        "400":
          $ref: "#/components/responses/NotPrepared"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/retry:
    post:
      tags: [Feed API]
      summary: Retry every feed's failed episodes
      description: |
        Does what `POST /api/v1/feeds/{feedID}/retry` does, for every feed
        whose episodes Solstein prepares; other feeds are skipped. Returns
        the total queued.
      operationId: retryAllFailedEpisodes
      responses:
        "200":
          $ref: "#/components/responses/Queued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/feeds/{feedID}/prepare:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    post:
      tags: [Feed API]
      summary: Prepare a feed's episodes ahead
      description: |
        Queues the feed's newest episodes that are published without their
        file (backlog, or expired from the cache) to be downloaded — or,
        with region diff, cleaned — in the background, so no client waits
        for them. New episodes are prepared first; the queued ones follow
        two at a time, newest first. An episode that fails is left for its
        next request, as if it hadn't been queued.
      operationId: prepareEpisodes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                newest:
                  type: integer
                  minimum: 0
                  description: Only consider the feed's newest this many episodes. Zero or omitted means all of them.
            examples:
              newestTen:
                value:
                  newest: 10
      responses:
        "200":
          $ref: "#/components/responses/Queued"
        "400":
          description: Invalid body, or the feed's episodes aren't prepared (see `NotPrepared`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/feeds/{feedID}/rules:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    get:
      tags: [Feed API]
      summary: A feed's rules
      description: The feed's rules, in the order they are tried. A feed without rules has an empty list.
      operationId: getFeedRules
      responses:
        "200":
          $ref: "#/components/responses/Rules"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Feed API]
      summary: Replace a feed's rules
      description: |
        Replaces the feed's rules with the list given; an empty list removes
        them. Rules are tried in order and the first one an episode matches
        decides: `hide` leaves it out of the served feed and keeps it from
        being prepared in the background, `tag` sets its
        `<itunes:episodeType>`, adding the element when the source has none.
        Episodes already stored are hidden or shown to match at once; one
        no longer hidden is prepared as a new one would be. An invalid list
        is refused as a whole, and the rules stay as they were.
      operationId: replaceFeedRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rules"
            examples:
              tagBonusClips:
                summary: Short clips as bonus, the rest as full episodes
                value:
                  rules:
                    - max_seconds: 3600
                      action: tag
                      episode_type: bonus
                    - action: tag
                      episode_type: full
              hideTrailers:
                value:
                  rules:
                    - title_matches: "^trailer"
                      action: hide
      responses:
        "200":
          $ref: "#/components/responses/Rules"
        "400":
          description: Invalid body, or an invalid rule (the error names which).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /:
    get:
      tags: [Web UI]
      summary: Redirect to the web UI
      operationId: getRoot
      security: []
      responses:
        "302":
          description: To `/ui`.

  /ui:
    get:
      tags: [Web UI]
      summary: Web UI start page
      description: |
        `/ui/` redirects here (`301`).
      operationId: getUI
      security: []
      responses:
        "302":
          description: To `/ui/feeds`.

  /ui/feeds:
    get:
      tags: [Web UI]
      summary: Feed list page
      description: |
        Every feed with its region diff and prepare-ahead settings, each as
        in use and as the feed's own override. After a save, `saved` names
        the feed, for the page's notice.
      operationId: getUIFeeds
      security: []
      parameters:
        - name: saved
          in: query
          required: false
          description: ID of the feed whose settings were just saved.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "500":
          description: The feeds couldn't be loaded; an HTML error page.
          content:
            text/html: {}

  /ui/feeds/{feedID}/retry:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    post:
      tags: [Web UI]
      summary: Retry a feed's failed episodes
      description: |
        As `POST /api/v1/feeds/{feedID}/retry`: every failed episode,
        withheld or published unprocessed, is queued for another attempt.
      operationId: postUIFeedRetry
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                show:
                  type: string
                  enum: ["", all, problems]
                  description: The view the action was taken in, to come back to.
      responses:
        "303":
          description: To `/ui/feeds/{feedID}?done=retry&count=<queued>`.
        "400":
          description: The feed's episodes aren't prepared (stream or original mode).
        "404":
          description: No such feed.

  /ui/feeds/{feedID}/prepare:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    post:
      tags: [Web UI]
      summary: Prepare a feed's episodes without their file
      description: |
        As `POST /api/v1/feeds/{feedID}/prepare` with no `newest`: every
        episode published without its file is queued, newest first.
      operationId: postUIFeedPrepare
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                show:
                  type: string
                  enum: ["", all, problems]
                  description: The view the action was taken in, to come back to.
      responses:
        "303":
          description: To `/ui/feeds/{feedID}?done=prepare&count=<queued>`.
        "400":
          description: The feed's episodes aren't prepared (stream or original mode).
        "404":
          description: No such feed.

  /ui/feeds/{feedID}/rules:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    post:
      tags: [Web UI]
      summary: Save a feed's rules
      description: |
        The feed page's rule editor: as `PUT /api/v1/feeds/{feedID}/rules`,
        the whole list at once. Rows are numbered from 0; a row marked
        `remove`, or with every field empty (the editor's new row left
        blank), is left out, and the rest are saved in the order of their
        `position` (ties keep the rows' order). The last row is the new
        rule (marked `rule-{n}-new`), whose position n means "before rule
        n" (one past the last: at the end). Lengths are `M:SS` or `H:MM:SS`, empty for no limit.
      operationId: postUIFeedRules
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                check:
                  type: string
                  description: Set (the "Check without saving" button) to check the rules and show what they would do without saving them; the answer is then `200` with the page.
                rules:
                  type: integer
                  description: How many rows the form has.
                rule-{n}-position:
                  type: integer
                  description: Where row n goes, from 1.
                rule-{n}-title:
                  type: string
                  description: The title pattern (regular expression, ignoring case); empty matches any title.
                rule-{n}-at-least:
                  type: string
                  examples: ["20:00"]
                rule-{n}-at-most:
                  type: string
                  examples: ["1:00:00"]
                rule-{n}-action:
                  type: string
                  enum: [hide, "tag:full", "tag:bonus", "tag:trailer"]
                rule-{n}-remove:
                  type: string
                  enum: ["on"]
                rule-{n}-new:
                  type: string
                  enum: ["1"]
                  description: Marks the new rule's row, whose position n means "before rule n".
      responses:
        "200":
          description: With `check`, the feed page showing what the rules would do; nothing saved.
          content:
            text/html: {}
        "303":
          description: To `/ui/feeds/{feedID}?done=rules#rules`.
        "400":
          description: The feed page again, with what is wrong and the rows as sent.
          content:
            text/html: {}
        "404":
          description: No such feed.

  /ui/feeds/{feedID}/episodes/{episodeID}/queue:
    parameters:
      - $ref: "#/components/parameters/FeedID"
      - name: episodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Web UI]
      summary: Retry or prepare one episode
      description: |
        A failed episode is queued to be tried again, one published without
        its file to be prepared, in the background.
      operationId: postUIEpisodeQueue
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                show:
                  type: string
                  enum: ["", all, problems]
                  description: The view the action was taken in, to come back to.
      responses:
        "303":
          description: Queued; to `/ui/feeds/{feedID}?done=queued&episode={episodeID}`.
        "200":
          description: Nothing to queue (it has its file, or is waiting already); the feed page with a notice.
        "400":
          description: The feed's episodes aren't prepared.
        "404":
          description: No such feed or episode.
        "409":
          description: The episode is being prepared right now.

  /ui/feeds/{feedID}/episodes/{episodeID}/serve:
    parameters:
      - $ref: "#/components/parameters/FeedID"
      - name: episodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Web UI]
      summary: Set whether one dropped episode is served
      description: |
        Whether an episode the source no longer lists stays in the served
        feed, overriding the feed's `serve_dropped`. Clears any warning
        Solstein gave when it stopped serving the episode itself (its source
        answered that the audio is gone).
      operationId: postUIEpisodeServe
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                serve:
                  type: string
                  enum: ["", "on", "off"]
                  description: Empty follows the feed.
                show:
                  type: string
                  enum: ["", all, problems]
                  description: The view the action was taken in, to come back to.
      responses:
        "303":
          description: Saved; to `/ui/feeds/{feedID}?done=serve&episode={episodeID}`.
        "400":
          description: Not one of Default, On or Off; the feed page with a notice.
        "404":
          description: No such feed or episode.

  /ui/feeds/{feedID}/episodes/{episodeID}/delete:
    parameters:
      - $ref: "#/components/parameters/FeedID"
      - name: episodeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Web UI]
      summary: Delete one dropped episode
      description: |
        Deletes an episode the source no longer lists, with its cached file.
        One the source still lists can't be deleted: the next poll would add
        it again, as a new episode.
      operationId: postUIEpisodeDelete
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                show:
                  type: string
                  enum: ["", all, problems]
                  description: The view the action was taken in, to come back to.
      responses:
        "303":
          description: Deleted; to `/ui/feeds/{feedID}?done=deleted`.
        "400":
          description: The source still lists the episode; the feed page with a notice.
        "404":
          description: No such feed or episode.
        "409":
          description: The episode is being prepared or served into the cache right now.

  /ui/login:
    get:
      tags: [Web UI]
      summary: Sign-in page
      description: |
        Username and password. Says so when no user exists yet (they are added on
        the console, `solstein user add`).
      operationId: getUILogin
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Where to go once signed in; a path under `/ui/` only, otherwise the feed list.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
    post:
      tags: [Web UI]
      summary: Sign in with username and password
      description: |
        On success: `303` to the next step (`/ui/login/password` after a one-time
        password, `/ui/login/totp` with an authenticator) with a `solstein_sign_in`
        cookie, or straight to `next` with the `solstein_session` cookie.
        Failed attempts are limited per username and per address.
      operationId: postUILogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: The username; case doesn't matter.
                password:
                  type: string
                  description: The password, or a one-time password from the console.
      responses:
        "303":
          description: To the next step, or signed in.
        "401":
          description: Wrong username or password; the page again.
        "429":
          description: Too many failed attempts; the page again, saying until when.

  /ui/login/password:
    get:
      tags: [Web UI]
      summary: Choose-a-password step
      description: |
        After signing in with a one-time password.
      operationId: getUILoginPassword
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Where to go once signed in; a path under `/ui/` only, otherwise the feed list.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
    post:
      tags: [Web UI]
      summary: Choose one's own password
      description: |
        Needs the `solstein_sign_in` cookie from the step before.
      operationId: postUILoginPassword
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password, repeat]
              properties:
                password:
                  type: string
                  description: The new password, 10 to 256 characters.
                repeat:
                  type: string
                  description: The same again.
      responses:
        "303":
          description: To the TOTP step, or signed in.
        "400":
          description: The two differ, it's too short, or it is the one-time password.
        "401":
          description: The sign-in took too long; back to the first step.

  /ui/login/totp:
    get:
      tags: [Web UI]
      summary: TOTP code step
      description: |
        For a user with an authenticator.
      operationId: getUILoginTOTP
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Where to go once signed in; a path under `/ui/` only, otherwise the feed list.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
    post:
      tags: [Web UI]
      summary: Sign in with a TOTP code
      description: |
        Needs the `solstein_sign_in` cookie. A code works once.
      operationId: postUILoginTOTP
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The six digits from the authenticator app.
      responses:
        "303":
          description: "Signed in: to `next`, with the `solstein_session` cookie."
        "401":
          description: Wrong or already used code, or the sign-in took too long.
        "429":
          description: Too many failed attempts.

  /ui/logout:
    post:
      tags: [Web UI]
      summary: Sign out
      description: |
        Ends the session and clears its cookie.
      operationId: postUILogout
      security: []
      responses:
        "303":
          description: To `/ui/login`.

  /ui/account:
    get:
      tags: [Web UI]
      summary: Account page
      description: |
        The signed-in user's password and authenticator. `done` names what was
        just changed, for the notice.
      operationId: getUIAccount
      security: []
      parameters:
        - name: done
          in: query
          required: false
          schema:
            type: string
            enum: [password, totp-on, totp-off]
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /ui/account/password:
    post:
      tags: [Web UI]
      summary: Change one's password
      description: |
        Other sessions end; a new session cookie replaces the current one.
      operationId: postUIAccountPassword
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [current, password, repeat]
              properties:
                current:
                  type: string
                  description: The current password.
                password:
                  type: string
                  description: The new password, 10 to 256 characters.
                repeat:
                  type: string
                  description: The same again.
      responses:
        "303":
          description: To `/ui/account?done=password`.
        "400":
          description: Wrong current password, or the new one doesn't fit the rules.

  /ui/account/totp/begin:
    post:
      tags: [Web UI]
      summary: Start setting up an authenticator
      description: |
        Makes a pending secret (or keeps the one already pending).
      operationId: postUIAccountTOTPBegin
      security: []
      responses:
        "303":
          description: To `/ui/account/totp`.

  /ui/account/totp:
    get:
      tags: [Web UI]
      summary: Authenticator set-up page
      description: |
        The pending secret as a QR code (inline SVG), as text, and as an
        `otpauth://` link. With nothing pending, `303` to `/ui/account`.
      operationId: getUIAccountTOTP
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
    post:
      tags: [Web UI]
      summary: Turn the authenticator on
      description: |
        Given a code from it.
      operationId: postUIAccountTOTP
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The six digits the app shows.
      responses:
        "303":
          description: To `/ui/account?done=totp-on`.
        "400":
          description: The code doesn't match; the set-up page again.

  /ui/account/totp/disable:
    post:
      tags: [Web UI]
      summary: Remove the authenticator
      description: |
        Given the password.
      operationId: postUIAccountTOTPDisable
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: The password.
      responses:
        "303":
          description: To `/ui/account?done=totp-off`.
        "400":
          description: Wrong password.

  /ui/instance:
    get:
      tags: [Web UI]
      summary: Instance page
      description: |
        This Solstein as it runs: version, start time, the modules and how
        they came up, the exits, the defaults feeds follow, and who may
        reach it. Read-only; never a token, signing key or VPN key, nor the
        `env:`/`file:` references to them.
      operationId: getUIInstance
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /ui/exits:
    get:
      tags: [Web UI]
      summary: Exits page
      description: |
        The exits and VPN tunnels as they are right now: each exit's
        locations, current server and tunnel (users, last handshake, which
        key by number), what uses it, each provider's servers, keys, tunnel
        limit, open tunnels and benched servers, the default and direct
        exits, and start-up's check that every exit in use at once can have
        a tunnel. Read-only; never a key or a reference to one.
      operationId: getUIExits
      security: []
      parameters:
        - name: live
          in: query
          required: false
          description: "`off` stops the page updating itself while a tunnel is open (the no-JavaScript Stop link)."
          schema:
            type: string
            enum: ["off"]
      responses:
        "200":
          description: The page.
          content:
            text/html: {}

  /ui/feeds/{feedID}:
    parameters:
      - $ref: "#/components/parameters/FeedID"
    get:
      tags: [Web UI]
      summary: Feed page
      description: |
        One feed: its settings, a count of its episodes by status, and its
        episodes newest first (the newest 50 unless `show` says otherwise),
        each with its status, what processing did or what went wrong (URLs
        in errors cut down to their host), and Retry or Prepare where it
        applies. An episode the source no longer lists says so, whether it
        is still served, and has its own serve setting and a Delete button.
        `done` (with `episode` or `count`) names what was just done, for the
        notice.
      operationId: getUIFeed
      security: []
      parameters:
        - name: show
          in: query
          required: false
          schema:
            type: string
            enum: [all, problems]
        - name: live
          in: query
          required: false
          description: "`off` stops the page updating itself while work is in progress (the no-JavaScript Stop link)."
          schema:
            type: string
            enum: ["off"]
        - name: done
          in: query
          required: false
          schema:
            type: string
            enum: [saved, queued, retry, prepare]
        - name: episode
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: count
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The page.
          content:
            text/html: {}
        "404":
          description: No such feed; an HTML error page.
          content:
            text/html: {}
    post:
      tags: [Web UI]
      summary: Save a feed's settings from the feed list
      description: |
        Only the fields sent are changed; `region_diff` is ignored when the
        region-diff module isn't running. Answered with a redirect back to
        the list, or to the feed page when `from` is `feed`
        (post/redirect/get).
      operationId: postUIFeedSettings
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                region_diff:
                  type: string
                  enum: ["", "on", "off"]
                  description: Empty follows `region_diff.enabled`.
                prepare_ahead:
                  type: string
                  enum: ["", "on", "off"]
                  description: Empty follows `prepare_ahead`.
                serve_dropped:
                  type: string
                  enum: ["", "on", "off"]
                  description: Empty follows `serve_dropped_episodes`.
                delete_dropped:
                  type: string
                  enum: ["", "on", "off"]
                  description: Empty follows `delete_dropped_episodes`.
                from:
                  type: string
                  enum: [feed]
                  description: Sent by the feed page, to come back to it.
      responses:
        "303":
          description: Saved; to `/ui/feeds?saved={feedID}`, or `/ui/feeds/{feedID}?done=saved`.
        "400":
          description: A value other than empty, `on` or `off`, or a setting the feed can't have; the list with an error notice.
          content:
            text/html: {}
        "403":
          description: Posted from another site, or from outside `allowed_client_networks`.
        "404":
          description: No such feed; an HTML error page.
          content:
            text/html: {}
        "500":
          description: The settings couldn't be saved; an HTML error page.
          content:
            text/html: {}

  /ui/static/{file}:
    parameters:
      - name: file
        in: path
        required: true
        description: "`style.css`, `icon.svg` or `live.js`."
        schema:
          type: string
    get:
      tags: [Web UI]
      summary: The web UI's stylesheet and icon
      operationId: getUIStatic
      security: []
      responses:
        "200":
          description: The file; cached for a day, as links carry the version.
          content:
            text/css: {}
            image/svg+xml: {}
            text/javascript: {}
        "404":
          description: No such file.

security:
  - bearerToken: []
  - queryToken: []

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: "The subscribe token (`auth_token`) as `Authorization: Bearer <token>`."
    queryToken:
      type: apiKey
      in: query
      name: token
      description: The subscribe token as `?token=`, for a quick look in a browser. The bearer header wins when both are given.

  parameters:
    FeedID:
      name: feedID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Signature:
      name: sig
      in: query
      required: true
      description: The URL's signature, as Solstein wrote it (not needed with `disable_auth`).
      schema:
        type: string

  responses:
    Rules:
      description: The feed's rules, in the order they are tried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Rules"
    Queued:
      description: How many episodes were queued.
      content:
        application/json:
          schema:
            type: object
            required: [queued]
            properties:
              queued:
                type: integer
    NotPrepared:
      description: The feed's episodes aren't prepared by Solstein (`stream` or `original` mode without region diff), so there is nothing to queue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Feed:
      description: The rewritten RSS feed. Clients should revalidate on every request.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-cache
      content:
        application/rss+xml:
          schema:
            type: string
    Audio:
      description: The episode's audio.
      headers:
        Content-Length:
          schema:
            type: integer
        Accept-Ranges:
          schema:
            type: string
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
    PartialAudio:
      description: Part of the episode's audio, for a `Range` request.
      headers:
        Content-Range:
          schema:
            type: string
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
    StillProcessing:
      description: The episode is still being processed (region diff took over 20 seconds, or failed this time and will be tried again). Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            examples: [30]
      content:
        text/plain:
          schema:
            type: string
    BadSignature:
      description: Missing or wrong signature, or client outside `allowed_client_networks`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or wrong subscribe token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such feed or episode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed inside Solstein; the details are in its log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Rules:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Rule"

    Rule:
      type: object
      description: |
        Which episodes a rule matches, and what it does with them. Every
        condition given must hold; a rule without conditions matches every
        episode, so it can end the list as a catch-all.
      required: [action]
      properties:
        title_matches:
          type: string
          maxLength: 500
          description: A regular expression (Go syntax, case-insensitive) the episode's title must contain a match for; empty matches any title.
          examples: ["^trailer", " / "]
        min_seconds:
          type: integer
          minimum: 0
          description: The episode's length must be at least this; 0 means no lower bound. The length is the source's stated duration, else the processed file's; an episode with neither never matches a rule with a length bound.
        max_seconds:
          type: integer
          minimum: 0
          description: The episode's length must be at most this; 0 means no upper bound.
        action:
          type: string
          enum: [hide, tag]
        episode_type:
          type: string
          enum: [full, bonus, trailer]
          description: What `tag` sets as `<itunes:episodeType>`. Only with `tag`, and required with it.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: ["Feed not found."]

    FeedSettings:
      type: object
      description: |
        Per-feed settings. Each is optional; an empty value means the global
        setting from `config.json` applies.
      properties:
        exit:
          type: string
          description: The exit the feed's polls, downloads and streams go through; empty means `default_exit`.
          examples: [norway, direct]
        delivery_mode:
          type: string
          enum: ["", cache, stream, original]
          description: How audio is delivered when no processor handles the feed.
        poll_interval_minutes:
          type: integer
          minimum: 0
          description: Minutes between polls; 0 means `poll_interval_minutes`.
        region_diff:
          type: string
          enum: ["", "on", "off"]
          description: Region diff for this feed; empty follows `region_diff.enabled`. `on` needs region diff to be running.
        region_diff_exits:
          type: array
          description: The feed's own pair of exits, home region first; empty uses `region_diff.exits`.
          items:
            type: string
          maxItems: 2
          examples: [[norway, sweden]]
        region_diff_on_failure:
          type: string
          enum: ["", publish, hide]
          description: What happens to an episode that can't be processed; empty follows `region_diff.on_failure`.
        region_diff_trim_break_markers:
          type: string
          enum: ["", "on", "off"]
          description: Also remove break markers that can be cut cleanly; empty follows `region_diff.trim_break_markers`.
        region_diff_compare_by_audio:
          type: string
          enum: ["", "on", "off"]
          description: Compare downloads that share no MP3 frame (the host re-encodes around its ads) by their loudness over time; empty follows `region_diff.compare_by_audio` (on by default).
        prepare_ahead:
          type: string
          enum: ["", "on", "off"]
          description: >-
            Prepare every episode before any client asks for it, and keep it out of the feed until its
            file is ready (the backlog included); empty follows `prepare_ahead`.
        serve_dropped:
          type: string
          enum: ["", "on", "off"]
          description: >-
            Keep serving episodes the source no longer lists, and keep them for good (their cached
            files never expire); empty follows `serve_dropped_episodes` (off by default). An episode
            can override it on the feed page.
        delete_dropped:
          type: string
          enum: ["", "on", "off"]
          description: >-
            Delete episodes the source no longer lists, with their cached files, a day after they drop
            out, unless they are served; empty follows `delete_dropped_episodes` (off by default).

    Feed:
      description: A subscribed feed, its settings and its state.
      allOf:
        - $ref: "#/components/schemas/FeedSettings"
        - type: object
          required: [id, source_url, feed_url, delivery_mode_in_use, region_diff_in_use, prepare_ahead_in_use, serve_dropped_in_use, delete_dropped_in_use]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            source_url:
              type: string
              format: uri
              description: The source feed, normalised.
            title:
              type: string
            last_polled_at:
              type: [string, "null"]
              format: date-time
            last_success_at:
              type: [string, "null"]
              format: date-time
            last_error:
              type: string
              description: Why the last poll failed; empty after a successful one.
            delivery_mode_in_use:
              type: string
              enum: [cache, stream, original]
              description: The delivery mode after the global setting is applied.
            region_diff_in_use:
              type: boolean
              description: Whether region diff processes the feed's episodes, after the global and per-feed settings are combined.
            prepare_ahead_in_use:
              type: boolean
              description: Whether the feed's episodes are all prepared before a client asks, after the global and per-feed settings are combined.
            serve_dropped_in_use:
              type: boolean
              description: Whether episodes the source no longer lists stay in the served feed (unless an episode says otherwise), after the global and per-feed settings are combined.
            delete_dropped_in_use:
              type: boolean
              description: Whether episodes the source no longer lists, and that aren't served, are deleted, after the global and per-feed settings are combined.
            feed_url:
              type: string
              format: uri
              description: The signed feed URL to subscribe to in a podcast client.
